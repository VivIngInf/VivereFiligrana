[project]
name = "Vivere-Filigrana"
version = "0.1.0"
description = "Utility per filigranare file PDF e DOCX con i simboli dell'associazione Vivere Ateneo di UNIPA"
requires-python = ">=3.10"

dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23.0",
    "python-dotenv>=1.2",
    "pdfrw>=0.4",
]

[project.optional-dependencies]
dev = [
    "livereload>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]

[tool.hatch.build.targets.wheel.sources]
"source" = "vivere_filigrana"